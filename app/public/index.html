<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>Training Plan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="header-row">
    <h1>Training Plan</h1>
    <span class="phase-badge" id="phaseBadge">…</span>
  </div>
  <div class="week-strip" id="weekStrip" aria-label="Next 7 days"></div>
  <div class="mock-banner" id="mockBanner" hidden>Demo data. Changes are not saved.</div>

</header>

<nav class="bottom-nav" id="bottomNav" aria-label="Sections">
  <button class="nav-btn" data-act="nav" data-to="today" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <span>Today</span>
  </button>
  <button class="nav-btn" data-act="nav" data-to="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Plan</span>
  </button>
  <button class="nav-btn" data-act="nav" data-to="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Progress</span>
  </button>
  <button class="nav-btn" data-act="nav" data-to="more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <span>More</span>
  </button>
</nav>

<main>
  <div class="live-bar" id="liveBar" role="region" aria-label="Live Session" hidden></div>
  <div class="sr-only" id="liveAnnounce" role="status" aria-live="polite"></div>
  <section class="tab-pane active" id="tab-today" aria-label="Today" tabindex="-1"></section>
  <section class="tab-pane" id="tab-plan" aria-label="Plan" tabindex="-1">
    <h2 class="sr-only" id="h-plan" tabindex="-1">Plan</h2>
    <div class="plan-layout">
      <div class="plan-main" id="planMain"></div>
      <aside class="day-panel" id="dayPanel" aria-label="Day details" tabindex="-1"></aside>
    </div>
  </section>
  <section class="tab-pane" id="tab-progress" aria-label="Progress" tabindex="-1"></section>
  <section class="tab-pane" id="tab-more" aria-label="More" tabindex="-1"></section>
  <!-- More sub-pages -->
  <section class="tab-pane" id="tab-trips" aria-labelledby="h-trips"></section>
  <section class="tab-pane" id="tab-events" aria-labelledby="h-events"></section>
  <section class="tab-pane" id="tab-testweek" aria-labelledby="h-testweek"></section>
  <section class="tab-pane" id="tab-tm" aria-labelledby="h-tm"></section>
  <section class="tab-pane" id="tab-routes" aria-labelledby="h-routes"></section>
  <section class="tab-pane" id="tab-routine" aria-labelledby="h-routine"></section>
  <section class="tab-pane" id="tab-settings" aria-labelledby="h-settings"></section>
  <section class="tab-pane" id="tab-start" aria-labelledby="h-start"></section>
</main>

<div class="timer" id="timer" hidden role="dialog" aria-modal="true" aria-labelledby="timerName" tabindex="-1"></div>
<div class="sheet-backdrop" id="sheet" hidden>
  <div class="sheet" id="sheetPanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
